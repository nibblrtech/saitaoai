# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    paths-ignore:
      - "docs/decisions/**"
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - "docs/decisions/**"

jobs:
  detect-adr-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_decisions_changed: ${{ steps.detect.outputs.docs_decisions_changed }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Detect docs/decisions changes
      id: detect
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          base_ref="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files="$(git diff --name-only "$base_ref"...HEAD)"
        else
          before_sha="${{ github.event.before }}"

          if [[ "$before_sha" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          else
            changed_files="$(git diff --name-only "$before_sha" HEAD)"
          fi
        fi

        if printf '%s\n' "$changed_files" | grep -q '^docs/decisions/'; then
          echo "docs_decisions_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "docs_decisions_changed=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: detect-adr-changes
    if: needs.detect-adr-changes.outputs.docs_decisions_changed != 'true'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - name: Sync mapped non-ArchUnit compliance tests
      env:
        ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
      run: ADR_FILES="$(printf '%s\n' docs/decisions/*.md)" node scripts/sync-adr-constraint-tests.mjs
    - name: Verify ADR compliance constraint coverage
      env:
        ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
      run: ADR_FILES="$(printf '%s\n' docs/decisions/*.md)" node scripts/verify-adr-constraint-coverage.mjs
    - run: npm run test
