name: Maintain ADR Architecture and Compliance Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/decisions/**"
      - "docs/testing/adr-constraint-to-test-mapping.md"
      - "scripts/check-new-constraints-needing-mapping.mjs"
      - "scripts/sync-adr-constraint-tests.mjs"
      - "scripts/verify-adr-constraint-coverage.mjs"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "docs/decisions/**"
      - "docs/testing/adr-constraint-to-test-mapping.md"
      - "scripts/check-new-constraints-needing-mapping.mjs"
      - "scripts/sync-adr-constraint-tests.mjs"
      - "scripts/verify-adr-constraint-coverage.mjs"
      - ".github/workflows/**"

jobs:
  generate-adr-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Collect ADR files
        id: changed_adrs
        shell: bash
        run: |
          set -euo pipefail

          # Always process all ADRs on every merge to main/master to keep test
          # suites continuously synchronized with the current ADR corpus.
          mapfile -t ADR_FILES < <(git ls-files 'docs/decisions/*.md')

          if [[ ${#ADR_FILES[@]} -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "adr_files<<EOF"
            printf '%s\n' "${ADR_FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Generate or update ADR tests with Copilot
        if: steps.changed_adrs.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
        shell: bash
        run: |
          set -euo pipefail

          # Policy summary:
          # 1) Every compliance constraint must have exactly one test strategy.
          # 2) Architecture constraints belong in *.test.ts (ArchUnit style).
          # 3) Non-ArchUnit constraints belong in *.compliance.test.ts.
          # 4) ADR_CONSTRAINT markers must match the exact ADR bullet text.
          # 5) Mapping + coverage verification is authoritative and can fail CI.

          # Ensure no stale COPILOT_GITHUB_TOKEN value can override native token auth.
          unset COPILOT_GITHUB_TOKEN || true

          # Fast preflight to fail with a clear auth error before processing ADR files.
          copilot -p "Reply with: auth-ok" --allow-tool=none --no-ask-user >/dev/null

          while IFS= read -r ADR_FILE; do
            [[ -z "$ADR_FILE" ]] && continue

            DECISION_NAME="$(basename "$ADR_FILE" .md)"
            TARGET_TEST_FILE="tests/${DECISION_NAME}.test.ts"
            TARGET_COMPLIANCE_TEST_FILE="tests/${DECISION_NAME}.compliance.test.ts"

            PROMPT="look at the Compliance Constraints of the checked in file ${ADR_FILE}. use docs/testing/adr-constraint-to-test-mapping.md as the authoritative routing policy. create or update architecture tests for that component in ${TARGET_TEST_FILE} using TypeScript, vitest, and @nielspeter/ts-archunit patterns from this repository. for constraints that are not representable as ts-archunit rules, create or update additional compliance tests in ${TARGET_COMPLIANCE_TEST_FILE}; use executable tests when possible, and use it.todo placeholders when deterministic executable checks are not yet available. add one line comment marker above each test in either file with this exact format: ADR_CONSTRAINT: <exact constraint text from ADR bullet>. every compliance constraint bullet must be mapped to at least one test marker in either ${TARGET_TEST_FILE} or ${TARGET_COMPLIANCE_TEST_FILE}. preserve existing tests and only modify/create these two files for this ADR."

            copilot -p "$PROMPT" \
              --allow-tool=write \
              --allow-tool='shell(cat:*)' \
              --allow-tool='shell(ls:*)' \
              --allow-tool='shell(find:*)' \
              --allow-tool='shell(grep:*)' \
              --allow-tool='shell(node:*)' \
              --allow-tool='shell(npm:*)' \
              --allow-tool='shell(npx:*)' \
              --allow-tool='shell(which:*)' \
              --allow-tool='shell(head:*)' \
              --allow-tool='shell(tail:*)' \
              --allow-tool='shell(env:*)' \
              --allow-tool='shell(pwd:*)' \
              --allow-tool='shell(whoami:*)' \
              --allow-tool='shell(echo:*)' \
              --allow-tool='shell(true:*)' \
              --allow-tool='shell(git:*)' \
              --no-ask-user
          done <<< "$ADR_FILES"

      - name: Detect newly introduced constraints needing dedicated mapping
        if: steps.changed_adrs.outputs.has_changes == 'true'
        id: detect_mapping_needs
        env:
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
          ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
          ADR_NEEDS_MAPPING_FILE: .tmp/adr-needs-mapping.json
          ADR_ONLY_NEW_CONSTRAINTS: "true"
          ADR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          node scripts/check-new-constraints-needing-mapping.mjs

          NEEDS_COUNT="$(node -e 'const fs=require("fs");const p=process.env.ADR_NEEDS_MAPPING_FILE;const arr=JSON.parse(fs.readFileSync(p,"utf8"));process.stdout.write(String(arr.length));')"

          echo "needs_count=${NEEDS_COUNT}" >> "$GITHUB_OUTPUT"

          if [[ "$NEEDS_COUNT" -gt 0 ]]; then
            echo "needs_mapping=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_mapping=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evolve mapping/templates for new constraints with Copilot
        if: steps.detect_mapping_needs.outputs.needs_mapping == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ADR_NEEDS_MAPPING_FILE: .tmp/adr-needs-mapping.json
        shell: bash
        run: |
          set -euo pipefail

          unset COPILOT_GITHUB_TOKEN || true

          copilot -p "Reply with: auth-ok" --allow-tool=none --no-ask-user >/dev/null

          PROMPT="You are evolving the ADR test mapping subsystem. Read ${ADR_NEEDS_MAPPING_FILE}. For each listed constraint, prefer a deterministic archunit implementation first. If archunit cannot represent it, create a deterministic compliance template in scripts/sync-adr-constraint-tests.mjs and add a precise mapping rule in docs/testing/adr-constraint-to-test-mapping.md before the catch-all rule. Update tests/<decision>.test.ts when routed to archunit. Maintain ADR_CONSTRAINT marker fidelity and deterministic behavior. Avoid todo placeholders. Modify only these files as needed: docs/testing/adr-constraint-to-test-mapping.md, scripts/sync-adr-constraint-tests.mjs, tests/*.test.ts."

          copilot -p "$PROMPT" \
            --allow-tool=write \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(node:*)' \
            --allow-tool='shell(npm:*)' \
            --allow-tool='shell(npx:*)' \
            --allow-tool='shell(which:*)' \
            --allow-tool='shell(head:*)' \
            --allow-tool='shell(tail:*)' \
            --allow-tool='shell(env:*)' \
            --allow-tool='shell(pwd:*)' \
            --allow-tool='shell(whoami:*)' \
            --allow-tool='shell(echo:*)' \
            --allow-tool='shell(true:*)' \
            --allow-tool='shell(git:*)' \
            --no-ask-user

      - name: Enforce dedicated mapping for newly introduced constraints
        if: steps.changed_adrs.outputs.has_changes == 'true'
        env:
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
          ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
          ADR_NEEDS_MAPPING_FILE: .tmp/adr-needs-mapping.json
          ADR_ONLY_NEW_CONSTRAINTS: "true"
          ADR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ADR_FAIL_ON_NEEDS_MAPPING: "true"
        run: node scripts/check-new-constraints-needing-mapping.mjs

      - name: Detect all constraints currently relying on generic fallback
        if: steps.changed_adrs.outputs.has_changes == 'true'
        id: detect_all_mapping_needs
        env:
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
          ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
          ADR_NEEDS_MAPPING_FILE: .tmp/adr-needs-mapping-all.json
          ADR_ONLY_NEW_CONSTRAINTS: "false"
        shell: bash
        run: |
          set -euo pipefail

          node scripts/check-new-constraints-needing-mapping.mjs

          NEEDS_COUNT="$(node -e 'const fs=require("fs");const p=process.env.ADR_NEEDS_MAPPING_FILE;const arr=JSON.parse(fs.readFileSync(p,"utf8"));process.stdout.write(String(arr.length));')"

          echo "needs_count=${NEEDS_COUNT}" >> "$GITHUB_OUTPUT"

          if [[ "$NEEDS_COUNT" -gt 0 ]]; then
            echo "needs_mapping=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_mapping=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt migration of all generic fallback mappings with Copilot
        if: steps.detect_all_mapping_needs.outputs.needs_mapping == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ADR_NEEDS_MAPPING_FILE: .tmp/adr-needs-mapping-all.json
        shell: bash
        run: |
          set -euo pipefail

          unset COPILOT_GITHUB_TOKEN || true

          copilot -p "Reply with: auth-ok" --allow-tool=none --no-ask-user >/dev/null

          PROMPT="You are migrating ADR constraints away from generic fallback coverage. Read ${ADR_NEEDS_MAPPING_FILE}. For each listed constraint, prefer a deterministic archunit implementation first. If archunit cannot represent it, add a deterministic compliance template to scripts/sync-adr-constraint-tests.mjs and a precise mapping rule in docs/testing/adr-constraint-to-test-mapping.md before the catch-all rule. Update tests/<decision>.test.ts when routed to archunit. Keep catch-all in place as fallback, but migrate as many listed constraints as possible to dedicated mappings. Maintain ADR_CONSTRAINT marker fidelity and deterministic behavior. Avoid todo placeholders. Modify only these files as needed: docs/testing/adr-constraint-to-test-mapping.md, scripts/sync-adr-constraint-tests.mjs, tests/*.test.ts."

          copilot -p "$PROMPT" \
            --allow-tool=write \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(node:*)' \
            --allow-tool='shell(npm:*)' \
            --allow-tool='shell(npx:*)' \
            --allow-tool='shell(which:*)' \
            --allow-tool='shell(head:*)' \
            --allow-tool='shell(tail:*)' \
            --allow-tool='shell(env:*)' \
            --allow-tool='shell(pwd:*)' \
            --allow-tool='shell(whoami:*)' \
            --allow-tool='shell(echo:*)' \
            --allow-tool='shell(true:*)' \
            --allow-tool='shell(git:*)' \
            --no-ask-user

      - name: Re-check generic fallback migration progress
        if: steps.changed_adrs.outputs.has_changes == 'true'
        env:
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
          ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
          ADR_NEEDS_MAPPING_FILE: .tmp/adr-needs-mapping-all.json
          ADR_ONLY_NEW_CONSTRAINTS: "false"
        run: node scripts/check-new-constraints-needing-mapping.mjs

      - name: Sync mapped non-ArchUnit compliance tests
        if: steps.changed_adrs.outputs.has_changes == 'true'
        env:
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
          # Optional org-level shared mapping library (JSON text with { rules: [...] }).
          # If unset, scripts fall back to docs/testing/adr-constraint-to-test-mapping.md.
          ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
        run: node scripts/sync-adr-constraint-tests.mjs

      - name: Re-sync mapped non-ArchUnit compliance tests before verify
        if: steps.changed_adrs.outputs.has_changes == 'true'
        env:
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
          ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
        run: node scripts/sync-adr-constraint-tests.mjs

      - name: Enforce committed ADR-derived tests on pull requests
        if: github.event_name == 'pull_request' && steps.changed_adrs.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- tests; then
            echo "ADR-derived tests are out of date with current constraints."
            echo "Run the sync generator and commit updated tests before merging."
            git --no-pager diff -- tests
            exit 1
          fi

      - name: Verify ADR compliance constraint coverage
        if: steps.changed_adrs.outputs.has_changes == 'true'
        env:
          ADR_FILES: ${{ steps.changed_adrs.outputs.adr_files }}
          ADR_CONSTRAINT_MAPPING_JSON: ${{ vars.ADR_CONSTRAINT_MAPPING_JSON }}
        run: node scripts/verify-adr-constraint-coverage.mjs

      - name: Run test suite
        if: steps.changed_adrs.outputs.has_changes == 'true'
        run: npm test

      - name: Detect test changes
        if: steps.changed_adrs.outputs.has_changes == 'true'
        id: detect_changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- tests; then
            echo "tests_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tests_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request for generated tests
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.changed_adrs.outputs.has_changes == 'true' && steps.detect_changes.outputs.tests_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          commit-message: "test: generate ArchUnit tests from ADR compliance constraints"
          branch: "copilot/adr-archunit-tests-${{ github.run_id }}"
          title: "test: update ArchUnit tests from ADR changes"
          body: |
            This PR was generated automatically from ADR changes under docs/decisions.

            Generated updates:
            - Created or updated one test file per changed ADR in tests/.
            - Validated tests via npm test.

            Review focus:
            - Coverage of Compliance Constraints section
            - Alignment with existing architecture boundaries
          add-paths: |
            tests/*.test.ts
            :(glob)tests/**/*.test.ts
